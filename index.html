<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Plataforma de Cursos - Tests Interactivos</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Menú principal: listado de cursos -->
  <div id="main-menu" class="quiz-container">
    <h1>Tests preparación</h1>
    <h2>Bomber@s</h2>
    <p class="menu-description">by Beño</p>

    <div class="menu-options">
      <!-- <button class="menu-btn" onclick="openCourse('curso-controlincendios')">
        Curso — Control de Incendios
      </button>
      <button class="menu-btn" onclick="openCourse('curso-busquedayrescate')">
        Curso — Búsqueda y Rescate
      </button> -->
      <button class="menu-btn" onclick="openCourse('curso-riesgoselectricos')">
        Riesgos Eléctricos
      </button>
    </div>
  </div>

  <!-- Submenú: Control de Incendios -->
  <div id="curso-controlincendios" class="submenu quiz-container" style="display:none;">
    <h2>Control de Incendios</h2>
    <div class="menu-options">
      <button class="menu-btn" onclick="startTest('controlincendios/leccion1')">Lección 1</button>
      <button class="menu-btn" onclick="startTest('controlincendios/leccion2')">Lección 2</button>
      <button class="menu-btn" onclick="startTest('controlincendios/leccion3')">Lección 3</button>
      <button class="menu-btn" onclick="startTest('controlincendios/leccion4')">Lección 4</button>
      <button class="menu-btn" onclick="startTest('controlincendios/leccion5')">Lección 5</button>

      <button class="menu-btn final-test" onclick="startTest('controlincendios/final')">
        Evaluación Final (curso)
      </button>
    </div>

    <div class="btn-container">
      <button class="btn btn-back" onclick="returnToMainMenu()">Volver al Menú de Cursos</button>
    </div>
  </div>

  <!-- Submenú: Búsqueda y Rescate -->
  <div id="curso-busquedayrescate" class="submenu quiz-container" style="display:none;">
    <h2>Búsqueda y Rescate</h2>
    <div class="menu-options">
      <button class="menu-btn" onclick="startTest('busquedayrescate/leccion1')">Lección 1</button>
      <button class="menu-btn" onclick="startTest('busquedayrescate/leccion2')">Lección 2</button>
      <button class="menu-btn" onclick="startTest('busquedayrescate/leccion3')">Lección 3</button>

      <button class="menu-btn final-test" onclick="startTest('busquedayrescate/final')">
        Evaluación Final (curso)
      </button>
    </div>

    <div class="btn-container">
      <button class="btn btn-back" onclick="returnToMainMenu()">Volver al Menú de Cursos</button>
    </div>
  </div>

  <!-- Submenú: Riesgos Eléctricos -->
  <div id="curso-riesgoselectricos" class="submenu quiz-container" style="display:none;">
    <h2>Riesgos Eléctricos</h2>
    <div class="menu-options">
      <button class="menu-btn" onclick="startTest('riesgosElectricos/leccion1')">Lección 1</button>
      <button class="menu-btn" onclick="startTest('riesgosElectricos/leccion2')">Lección 2</button>
      <button class="menu-btn" onclick="startTest('riesgosElectricos/leccion3')">Lección 3</button>
      <button class="menu-btn" onclick="startTest('riesgosElectricos/leccion4')">Lección 4</button>
      <button class="menu-btn" onclick="startTest('riesgosElectricos/leccion5')">Lección 5</button>
      <button class="menu-btn" onclick="startTest('riesgosElectricos/leccion6')">Lección 6</button>

      <button class="menu-btn final-test" onclick="startTest('riesgosElectricos/final')">
        Evaluación Final (curso)
      </button>
    </div>

    <div class="btn-container">
      <button class="btn btn-back" onclick="returnToMainMenu()">Volver al Menú de Cursos</button>
    </div>
  </div>

  <!-- Contenedor del quiz -->
  <div id="quiz-section" class="quiz-container" style="display:none;">
    <h2 id="test-title">Prueba Interactiva</h2>
    <button class="btn btn-back" onclick="returnToMenu()">Volver al Menú</button>
    <p class="quiz-description">By Beño</p>

    <div class="quiz-info">
      <span id="question-counter"></span>
      <div class="timer-container">
        <div id="timer">60</div>
      </div>
    </div>

    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <div id="question-container"></div>

    <div class="btn-container" id="next-btn-container">
      <button class="btn" onclick="nextQuestion()">Siguiente</button>
    </div>

    <div class="question-numbers" id="question-numbers"></div>

    <p class="result" id="result"></p>

    <div class="btn-container" id="review-btn-container" style="display:none;">
      <button class="btn" id="review-btn" onclick="reviewAnswers()">Revisar Respuestas</button>
    </div>

    <div id="review-container" style="display:none;"></div>

    <div class="btn-container" id="restart-btn-container" style="display:none;">
      <button class="btn" onclick="restartQuiz()">Volver a intentar</button>
    </div>

    <div class="btn-container">
      <button class="btn btn-danger" onclick="resetQuiz()">Empezar desde cero</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
